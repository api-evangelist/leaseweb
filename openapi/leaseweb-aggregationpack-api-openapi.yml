tags:
- name: aggregationpack
paths:
  /aggregationPacks:
    get:
      description: 'List your Aggregation Packs. This api call supports pagination. Use the

        `limit` and `offset` query string parameters to paginate through all your

        aggregation packs.


        Every `aggregation pack` object in the json response lists a few properties of a aggregation pack.

        Use the single resource api call to get more details for a single aggregation pack.'
      operationId: getAggregationPackList
      parameters:
      - description: Limit the number of results returned.
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Return results starting from the given offset.
        example: 10
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              example:
                _metadata:
                  limit: 2
                  offset: 0
                  totalCount: 10
                connectContractItems:
                - id: '123456'
                  customerId: '1234'
                  salesOrgId: '2000'
                  contractStartDate: 2022-07-01 00:00:00+00:00
                  billingType: 95TH
                  connectivityType: BANDWIDTH_POOL
                  contractTerm: 36
                  dataTrafficCommit: 20000
                  dataTrafficCommitUnit: Mbps
                  networkPerformanceType: VOLUME
                  aggregationType: Hybrid
                - id: '1234567'
                  customerId: '1234'
                  salesOrgId: '2000'
                  contractStartDate: 2021-07-01 00:00:00+00:00
                  billingType: 95TH
                  connectivityType: BANDWIDTH_POOL
                  contractTerm: 36
                  dataTrafficCommit: 30000
                  dataTrafficCommitUnit: Mbps
                  networkPerformanceType: VOLUME
                  aggregationType: Hybrid
              schema:
                $ref: '#/components/schemas/getAggregationPackListResult'
          description: Ok.
        '401':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '401'
                errorMessage: You are not authorized to view this resource.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Not Authorized.
        '403':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '403'
                errorMessage: Access to the requested resource is forbidden.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Forbidden.
        '500':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '500'
                errorMessage: '''The API could not handle your request at this time.'
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '503'
                errorMessage: The API is not available at the moment.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Service Unavailable.
      summary: List aggregation packs
      tags:
      - aggregationpack
    servers:
    - url: https://api.leaseweb.com/bareMetals/v2
  /aggregationPacks/{aggregationPackId}:
    get:
      description: Use this API to get information about a single aggregation pack.
      operationId: getAggregationPack
      parameters:
      - description: The ID of aggregation pack
        explode: false
        in: path
        name: aggregationPackId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              example:
                aggregationType: Hybrid
                billingType: 95TH
                connectivityType: BANDWIDTH_POOL
                contractStartDate: 2022-07-01 00:00:00+00:00
                contractTerm: 36
                customerId: '1234'
                dataTrafficCommit: 20000
                dataTrafficCommitUnit: Mbps
                id: '123456'
                networkPerformanceType: VOLUME
                salesOrgId: '2000'
              schema:
                $ref: '#/components/schemas/aggregationPack'
          description: Ok.
        '401':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '401'
                errorMessage: You are not authorized to view this resource.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Not Authorized.
        '403':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '403'
                errorMessage: Access to the requested resource is forbidden.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Forbidden.
        '404':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '404'
                errorMessage: Resource not found
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Not Found.
        '500':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '500'
                errorMessage: '''The API could not handle your request at this time.'
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '503'
                errorMessage: The API is not available at the moment.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Service Unavailable.
      summary: Get aggregation pack
      tags:
      - aggregationpack
    servers:
    - url: https://api.leaseweb.com/bareMetals/v2
