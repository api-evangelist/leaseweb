        contractStartDate: 2000-01-23 04:56:07+00:00
        contractTerm: 0
        customerId: customerId
        dataTrafficCommitUnit: Gbps
        id: id
        dataTrafficCommit: 6
        salesOrgId: salesOrgId
      properties:
        id:
          description: Id of the aggregation pack
          type: string
        customerId:
          type: string
        salesOrgId:
          type: string
        contractStartDate:
          format: date-time
          type: string
        billingType:
          type: string
        connectivityType:
          type: string
        contractTerm:
          type: integer
        dataTrafficCommit:
          type: integer
        dataTrafficCommitUnit:
          $ref: '#/components/schemas/dataTrafficCommitUnit'
        networkPerformanceType:
          $ref: '#/components/schemas/networkPerformanceType'
        aggregationType:
          $ref: '#/components/schemas/aggregationType'
      required:
