              schema:
                $ref: '#/components/schemas/errorResult'
          description: Service Unavailable.
      security:
      - X-LSW-Auth: []
      summary: Inspect a report
      tags:
      - abuse
    servers:
    - url: https://api.leaseweb.com/abuse/v1
