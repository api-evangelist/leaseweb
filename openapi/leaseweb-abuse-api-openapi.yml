                errorCode: '503'
                errorMessage: The API is not available at the moment.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Service Unavailable.
      security:
      - X-LSW-Auth: []
      summary: List reports
      tags:
      - abuse
    servers:
    - url: https://api.leaseweb.com/abuse/v1
