                detectedIpAddresses:
                - 127.0.0.1
                id: '000005'
                latestMessages:
                - postedBy: CUSTOMER
                  postedAt: 2015-09-30 06:23:40+00:00
                  body: Hello, this is my first message!
                - postedBy: ABUSE_AGENT
