openapi: 3.2.0
info:
  title: Leaseweb Abuse API
  version: v1
  contact: {}
  license:
    name: Apache 2.0
    url: http://developer.leaseweb.com
  x-logo:
    altText: Leaseweb developer documentation
    backgroundColor: '#5484c6'
    href: https://developer.leaseweb.com
    url: https://developer.leaseweb.com/images/logo.png
  description: 'Operations tagged abuse across 2 of this provider''s published API definitions: leaseweb-abuse-openapi.yaml, leaseweb-abuse-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.leaseweb.com/abuse/v1
tags:
- name: abuse
paths:
  /reports:
    get:
      operationId: getReportList
      parameters:
      - description: Limit the number of results returned.
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Return results starting from the given offset.
        example: 10
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: 'Filter reports by their status (`?status=OPEN,CLOSED`): returns reports that have any of the listed statuses. Defaults to `OPEN,WAITING,CLOSED` if not provided.

          '
        example: OPEN,CLOSED
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/statusValue'
        style: form
      - description: Optional ticket ID to filter results
        explode: true
        in: query
        name: ticketId
        required: false
        schema:
          type: string
        style: form
      - description: 'Filter reports by IP addresses (`?ip=1.2.3.4,1.2.3.5`): returns reports that match any of the listed IP addresses.

          '
        examples:
          default:
            $ref: '#/components/examples/ipAddresses'
        explode: true
        in: query
        name: ip
        required: false
        schema:
          type: string
        style: form
      - description: 'Comma-separated list of sort field names. Prepend the field name with ''-'' for descending order. Sortable field names are deadline, reportedAt and updatedAt

          '
        example: deadline,-reportedAt,-updatedAt
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: The list is sorted in descending order by reportedAt
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              example:
                _metadata:
                  totalCount: 2
                  limit: 10
                  offset: 0
                reports:
                - id: '000000'
                  subject: Report description
                  status: OPEN
                  reportedAt: 2015-01-01 00:00:00+00:00
                  updatedAt: 2015-01-01 00:00:00+00:00
                  notifier: REDACTED_FOR_PRIVACY
                  customerId: '10000001'
                  legalEntityId: '2000'
                  deadline: 2015-01-01 00:00:00+00:00
                  detectedIpAddresses:
                  - 127.0.0.1
                - id: '000001'
                  subject: Report description
                  status: CLOSED
                  reportedAt: 2015-01-01 00:00:00+00:00
                  updatedAt: 2015-01-01 00:00:00+00:00
                  notifier: REDACTED_FOR_PRIVACY
                  customerId: '10000001'
                  legalEntityId: '2600'
                  deadline: 2015-01-01 00:00:00+00:00
                  detectedIpAddresses:
                  - 127.0.0.1
              schema:
                $ref: '#/components/schemas/getReportListResult'
          description: 'OK.

            '
        '400':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '400'
                errorDetails: {}
                errorMessage: The API could not interpret your request correctly.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Bad Request.
        '401':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '401'
                errorMessage: You are not authorized to view this resource.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Not Authorized.
        '403':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '403'
                errorMessage: Access to the requested resource is forbidden.
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Forbidden.
        '500':
          content:
            application/json:
              example:
                correlationId: 289346a1-3eaf-4da4-b707-62ef12eb08be
                errorCode: '500'
                errorMessage: '''The API could not handle your request at this time.'
              schema:
                $ref: '#/components/schemas/errorResult'
          description: Internal Server Error.
