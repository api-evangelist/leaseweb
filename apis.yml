aid: leaseweb
name: Leaseweb
description: Leaseweb is a Netherlands-founded global Infrastructure-as-a-Service provider offering dedicated (bare metal) servers, public and private cloud, object storage, CDN, colocation and networking.
  Its Developer API at api.leaseweb.com lets customers automate and integrate their infrastructure, authenticated with an API key sent in the X-LSW-Auth header; Leaseweb publishes the OpenAPI definitions
  in its leaseweb-go-sdk GitHub repository.
